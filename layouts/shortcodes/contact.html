<form
  class="contact-form"
  name="contact"
  method="POST"
  action="/thank-you/"
  data-netlify="true"
  data-netlify-honeypot="website"
  data-netlify-recaptcha="true">
  <input type="hidden" name="form-name" value="contact">
  <p class="form-honeypot">
    <label>Leave this field empty: <input name="website" autocomplete="off" tabindex="-1"></label>
  </p>

  <div class="form-field">
    <label for="contact-name">Name <span aria-hidden="true">*</span></label>
    <input id="contact-name" name="Name" type="text" autocomplete="name" required>
  </div>

  <div class="form-field">
    <label for="contact-email">Email <span aria-hidden="true">*</span></label>
    <input id="contact-email" name="Email" type="email" autocomplete="email" inputmode="email" required>
  </div>

  <div class="form-field">
    <label for="contact-message">Message <span aria-hidden="true">*</span></label>
    <textarea id="contact-message" name="Message" rows="7" required></textarea>
  </div>

  <div class="form-captcha" data-netlify-recaptcha="true"></div>
  <button type="submit">Send message</button>
</form>

<p class="contact-form__note">Please do not include sensitive personal or health information in this form.</p>
