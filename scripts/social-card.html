<!doctype html>
<!--

    msedge --headless=new --hide-scrollbars --force-device-scale-factor=1 \
      --window-size=1200,628 --screenshot=card.png scripts/social-card.html
    magick card.png -strip -quality 88 content/social-card-v6.jpg
