name: Update R dependencies

on:
  workflow_dispatch:
  schedule:
    # Propose R package updates monthly, independently of the content refresh.
    - cron: "41 6 15 * *"
  push:
    branches:
      - chore/futureproof-dependencies
    paths:
      - ".github/workflows/update-r-dependencies.yml"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: r-dependency-update
  cancel-in-progress: true

env:
  R_VERSION: "4.6.1"
  UPDATE_BRANCH: "automation/update-r-dependencies"

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository and theme
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ env.R_VERSION }}
          use-public-rspm: true

      - name: Set up Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Resolve current dependency lockfile
        run: |
          Rscript -e 'install.packages("renv", repos = "https://cloud.r-project.org")'
          Rscript scripts/update_renv_lock.R

      - name: Restore resolved dependency graph
        uses: r-lib/actions/setup-renv@v2

      - name: Validate publications with cached external metadata
        env:
          PUBLICATIONS_USE_CACHE_ONLY: "true"
        run: |
          Rscript -e 'blogdown::build_site(run_hugo = FALSE, build_rmd = "content/publications/index.Rmd")'
          Rscript scripts/check_generated_publications.R

      - name: Bootstrap lockfile on hardening branch
        if: github.event_name == 'push'
        run: |
          if [ -z "$(git status --porcelain -- renv.lock)" ]; then
            echo "renv.lock is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add renv.lock
          git commit -m "Lock R dependencies with renv"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"

      - name: Create or update dependency pull request
        if: github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain -- renv.lock)" ]; then
            echo "No R dependency updates are available."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$UPDATE_BRANCH:refs/remotes/origin/$UPDATE_BRANCH" || true
          git switch -C "$UPDATE_BRANCH"
          git add renv.lock
          git commit -m "Update R dependency lockfile"
          git push --force-with-lease origin "$UPDATE_BRANCH"

          pr_url="$(gh pr list --head "$UPDATE_BRANCH" --base main --state open --json url --jq '.[0].url')"
          if [ -n "$pr_url" ]; then
            gh pr edit "$pr_url" \
              --title "Update R dependencies" \
              --body "Automated monthly refresh of the tested R dependency lockfile. The publications page is rendered from committed API caches before this PR is proposed; normal site CI provides the remaining build checks."
          else
            gh pr create \
              --base main \
              --head "$UPDATE_BRANCH" \
              --title "Update R dependencies" \
              --body "Automated monthly refresh of the tested R dependency lockfile. The publications page is rendered from committed API caches before this PR is proposed; normal site CI provides the remaining build checks."
          fi
