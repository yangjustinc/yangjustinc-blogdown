name: Check teaching render

on:
  pull_request:
    paths:
      - "DESCRIPTION"
      - "content/teaching/index.Rmd"
      - "content/teaching/index.html"
      - "content/teaching/supervision-record.csv"
      - "data/site/students.csv"

permissions:
  contents: read

env:
  R_VERSION: "4.6.1"

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository and theme
        uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ env.R_VERSION }}
          use-public-rspm: true

      - name: Set up Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Install declared R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache-version: 2

      - name: Render teaching page
        run: >-
          Rscript -e
          'blogdown::build_site(run_hugo = FALSE,
          build_rmd = "content/teaching/index.Rmd")'

      - name: Verify generated files are current
        run: |
          git diff --exit-code -- \
            content/teaching/index.html \
            content/teaching/supervision-record.csv
