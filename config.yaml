baseurl: "https://www.justinyang.me"
enableRobotsTXT: true
locale: "en-GB"
title: "Justin C Yang"
theme: "hugo-xmin"

disableKinds:
  - RSS
  - taxonomy
  - term

security:
  allowContent:
    - "text/html"
    - "text/markdown"

ignoreFiles:
  - "\\.Rmd$"
  - "\\.Rmarkdown$"
  - "_cache$"
  - "\\.knit\\.md$"
  - "\\.utf8\\.md$"

footnotereturnlinkcontents: "↩"

menu:
  main:
    - name: Research
      url: "research/"
      weight: 1

    - name: Publications
      url: "publications/"
      weight: 2

    - name: Funding
      url: "funding/"
      weight: 3

    - name: Team
      url: "team/"
      weight: 4

    - name: Teaching
      url: "teaching/"
      weight: 5

    - name: Talks
      url: "talks/"
      weight: 6

    - name: About
      url: "about/"
      weight: 7

    - name: Contact
      url: "contact/"
      weight: 9

params:
  homeTitle: "Justin C Yang | Psychiatric Epidemiology & Health Data Science"
  description: "Dr Justin C Yang is a UCL psychiatric epidemiologist studying where inequalities in mental health arise as people's needs are recognised, or missed, by services."
  ogImage: "social-card-v4.jpg"
  ogImageAlt: "Mark of five coloured strands with the text: Justin C Yang, psychiatric epidemiologist studying where inequalities in mental health arise as people's needs are recognised, or missed, by services"
  person:
    affiliation: "University College London"
    jobTitle: "Senior Research Fellow"
    name: "Dr Justin C Yang"
    orcid: "https://orcid.org/0000-0003-2881-4906"

markup:
  highlight:
    codeFences: false
  goldmark:
    renderer:
      unsafe: true
