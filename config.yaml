baseurl: "https://www.justinyang.me"
enableRobotsTXT: true
locale: "en-GB"
title: "Justin C Yang"
theme: "hugo-xmin"

disableKinds:
  - RSS
  - taxonomy
  - term

security:
  allowContent:
    - "text/html"
    - "text/markdown"

ignoreFiles:
  - "\\.Rmd$"
  - "\\.Rmarkdown$"
  - "_cache$"
  - "\\.knit\\.md$"
  - "\\.utf8\\.md$"

footnotereturnlinkcontents: "↩"

