      weight: 2

    - name: Publications
      url: "publications/"
      weight: 3

    - name: Funding
      url: "funding/"
      weight: 4

    - name: Teaching
      url: "teaching/"
      weight: 5

    - name: Talks
      url: "talks/"
      weight: 6

    - name: Resources
      url: "resources/"
      weight: 7

    - name: Leadership
      url: "leadership/"
      weight: 8

    - name: Contact
      url: "contact/"
      weight: 9

params:
  homeTitle: "Justin C Yang | Psychiatric Epidemiology & Health Data Science"
  description: "Dr Justin C Yang is a psychiatric epidemiologist and health data scientist at UCL, using linked administrative and electronic health-record data, longitudinal studies, and causal and computational methods to study mental-health trajectories and inequalities."
  footer: "[Justin C Yang](https://www.justinyang.me) · MINDSET research programme · UCL Division of Psychiatry <br> &copy; 2019-{Year}"
  ogImage: "social-card.jpg"
  ogImageAlt: "MINDSET inference-aperture mark and programme title, led by Dr Justin C Yang"
  person:
    affiliation: "University College London"
    jobTitle: "Senior Research Fellow"
    name: "Dr Justin C Yang"
    orcid: "https://orcid.org/0000-0003-2881-4906"

markup:
  highlight:
    codeFences: false
  goldmark:
    renderer:
      unsafe: true
